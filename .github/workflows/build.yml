# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build & Test on Pull Request to master

on:
  #push:
  #  branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Restore dependencies
      run: dotnet restore linc.slnx
      
    - name: Build
      run: dotnet build linc.slnx --no-restore

    # todo: uncomment this when we have unit tests
    # - name: Test
    #   run: dotnet test linc.slnx --no-build --verbosity normal
